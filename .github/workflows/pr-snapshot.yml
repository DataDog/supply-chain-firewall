name: PR snapshot

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: "Snapshot for PR #${{ github.event.pull_request.number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build all snapshot binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.19.0
          args: build --snapshot --clean

      - name: Name the binaries for this PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir snapshots
          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            cp dist/scfw_"$target"*/scfw "snapshots/scfw-snapshot-pr-${PR_NUMBER}-${target//_/-}-attempt-${GITHUB_RUN_ATTEMPT}"
          done

      # Raw artifact names come from the filename. Keep each attempt separate
      # so reruns never delete IDs that a published comment still links to.
      - name: Upload macOS arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scfw-snapshot-pr-${{ github.event.pull_request.number }}-darwin-arm64-attempt-${{ github.run_attempt }}
          path: snapshots/scfw-snapshot-pr-${{ github.event.pull_request.number }}-darwin-arm64-attempt-${{ github.run_attempt }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scfw-snapshot-pr-${{ github.event.pull_request.number }}-darwin-amd64-attempt-${{ github.run_attempt }}
          path: snapshots/scfw-snapshot-pr-${{ github.event.pull_request.number }}-darwin-amd64-attempt-${{ github.run_attempt }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scfw-snapshot-pr-${{ github.event.pull_request.number }}-linux-arm64-attempt-${{ github.run_attempt }}
          path: snapshots/scfw-snapshot-pr-${{ github.event.pull_request.number }}-linux-arm64-attempt-${{ github.run_attempt }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scfw-snapshot-pr-${{ github.event.pull_request.number }}-linux-amd64-attempt-${{ github.run_attempt }}
          path: snapshots/scfw-snapshot-pr-${{ github.event.pull_request.number }}-linux-amd64-attempt-${{ github.run_attempt }}
          archive: false
          if-no-files-found: error
          retention-days: 30
