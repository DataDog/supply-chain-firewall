name: test

on:
  pull_request:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test snapshot comment automation
        run: node --test .github/scripts/*.test.cjs

      - name: Set up uv for legacy archive regression
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.0"
          enable-cache: false

      - name: Test uv Zstandard archives
        run: go test -count=2 ./scfw/internal/cli -run '^TestUVZstandardDownloads$'

      - name: Set up uv for integration tests
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: false

      - name: Set up Yarn for integration tests
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/yarn-classic" yarn@1.22.22
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/yarn-berry" @yarnpkg/cli-dist@4.18.1
          echo "SCFW_TEST_YARN_CLASSIC=$RUNNER_TEMP/yarn-classic/node_modules/yarn/bin/yarn.js" >> "$GITHUB_ENV"
          echo "SCFW_TEST_YARN_BERRY=$RUNNER_TEMP/yarn-berry/node_modules/@yarnpkg/cli-dist/bin/yarn.js" >> "$GITHUB_ENV"

      # pnpm 11 requires Node 22.13 or later.
      - name: Set up Node.js for pnpm integration tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # pnpm 12's npm package is a launcher that needs its install script, so
      # the native binary is installed directly.
      - name: Set up pnpm for integration tests
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/pnpm-10" pnpm@10.34.9
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/pnpm-11" pnpm@11.28.9
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/pnpm-12" @pnpm/exe.linux-x64@12.18.0
          echo "SCFW_TEST_PNPM_10=$RUNNER_TEMP/pnpm-10/node_modules/pnpm/bin/pnpm.cjs" >> "$GITHUB_ENV"
          echo "SCFW_TEST_PNPM_11=$RUNNER_TEMP/pnpm-11/node_modules/pnpm/bin/pnpm.mjs" >> "$GITHUB_ENV"
          echo "SCFW_TEST_PNPM_12=$RUNNER_TEMP/pnpm-12/node_modules/@pnpm/exe.linux-x64/pnpm" >> "$GITHUB_ENV"

      - name: Run tests
        # The real package-manager end-to-end tests exceed go test's default
        # 10-minute package timeout when run twice.
        run: go test -count=2 -timeout 25m ./scfw/...

  poetry-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        poetry: ["poetry==2.0.0", "poetry>=2,<3"]
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        env:
          POETRY_REQUIREMENT: ${{ matrix.poetry }}
        run: python -m pip install "$POETRY_REQUIREMENT"

      - name: Test Poetry proxy integration
        run: go test -count=1 ./scfw/internal/cli ./scfw/internal/pm/poetry -run 'TestPoetry|TestPyPIRegistrations'
