          - pip-version: "25.0"
            python-version: "3.13"
          - pip-version: "25.1"
            python-version: "3.13"
          - pip-version: "25.2"
            python-version: "3.13"
          - pip-version: "25.3"
            python-version: "3.14"
          - pip-version: "26.0"
            python-version: "3.14"
          - pip-version: "26.1"
            python-version: "3.14"
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python v${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip v${{ matrix.pip-version }}
        run: |
          python -m pip install pip==${{ matrix.pip-version }}

      - name: Test pip integration
        run: make test-pip

  test-poetry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        poetry-version: ["1.7.0", "1.8.0", "2.0.0", "2.1.0", "2.2.0", "2.3.0", "2.4.0"]
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Poetry v${{ matrix.poetry-version }}
        run: pipx install poetry==${{ matrix.poetry-version }}

      - name: Test Poetry integration
        run: make test-poetry
