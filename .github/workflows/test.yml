name: test

on:
  pull_request:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test snapshot comment automation
        run: node --test .github/scripts/*.test.cjs

      - name: Set up uv for legacy archive regression
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.0"
          enable-cache: false

      - name: Test uv Zstandard archives
        run: go test -count=2 ./scfw/internal/cli -run '^TestUVZstandardDownloads$'

      - name: Set up uv for integration tests
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: false

      - name: Run tests
        run: go test -count=2 ./scfw/...

  poetry-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        poetry: ["poetry==2.0.0", "poetry>=2,<3"]
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        env:
          POETRY_REQUIREMENT: ${{ matrix.poetry }}
        run: python -m pip install "$POETRY_REQUIREMENT"

      - name: Test Poetry proxy integration
        run: go test -count=1 ./scfw/internal/cli ./scfw/internal/pm/poetry -run 'TestPoetry|TestPyPIRegistrations'
