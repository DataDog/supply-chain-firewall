name: test

on:
  pull_request:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-build
          - test-cli
          - test-ddapi
          - test-ecosystem
          - test-pm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

  test-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "15.0.0"
            npm-version: "7.0"
