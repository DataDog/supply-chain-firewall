    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm v${{ matrix.npm-version }}
        run: |
          if [ "${{ matrix.node-version }}" = "15.0.0" ]; then
            # Known issue on npm v7.x: need to first install this manually
            npm install -g agentkeepalive
          fi
          npm install -g npm@${{ matrix.npm-version }}

      - name: Test npm integration
        run: make test-npm

  test-pip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pip-version: "22.2"
            python-version: "3.10"
          - pip-version: "22.3"
            python-version: "3.10"
          - pip-version: "23.0"
            python-version: "3.11"
          - pip-version: "23.1"
            python-version: "3.11"
          - pip-version: "23.2"
