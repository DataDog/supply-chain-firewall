[mixed]
allow-insecure-host = ["string.example", { host = "table.example", scheme = "https", port = 8443 }, { host = "[::1]", port = 9443 }]
[wildcard]
allow-insecure-host = ["*"]
[literal-star]
allow-insecure-host = [{ host = "*" }]
[default-port]
allow-insecure-host = [{ host = "port.example", port = 443 }]
[bad-port]
allow-insecure-host = [{ host = "credential-secret.example", port = 65536 }]
[bad-type]
allow-insecure-host = [{ host = "credential-secret.example", port = "8443" }]
[missing-host]
allow-insecure-host = [{ scheme = "https" }]
[bad-string]
allow-insecure-host = ["credential-secret.example:invalid"]
[bad-list]
allow-insecure-host = "credential-secret.example"
